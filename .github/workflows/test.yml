name: Flux Drive tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run T-Sphere adversarial tests
        run: python -m unittest discover -s tsphere/tests -v
      - name: Run submission safety demo
        run: python tools/run_submission_demo.py
